<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>openLedMapper</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 22 22'%3E%3Crect width='22' height='22' rx='5' fill='%23111318'/%3E%3Cpath d='M6 4v14M11 4v14M16 4v14' stroke='%233cc8ff' stroke-width='2' stroke-linecap='round'/%3E%3Ccircle cx='6' cy='7' r='2' fill='%2346e08c'/%3E%3Ccircle cx='11' cy='11' r='2' fill='%2346e08c'/%3E%3Ccircle cx='16' cy='15' r='2' fill='%2346e08c'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 256 256" aria-hidden="true"><defs><linearGradient id="logoBg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16202f"/><stop offset="1" stop-color="#0d1420"/></linearGradient><filter id="logoGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="256" height="256" rx="56" fill="url(#logoBg)"/><g filter="url(#logoGlow)"><circle cx="128.0" cy="32.0" r="8.0" fill="#26ffff" opacity="0.45"/><circle cx="155.0" cy="35.9" r="8.0" fill="#26e1ff" opacity="0.48"/><circle cx="179.9" cy="47.2" r="8.0" fill="#26c3ff" opacity="0.50"/><circle cx="200.6" cy="65.1" r="8.0" fill="#26a6ff" opacity="0.53"/><circle cx="215.3" cy="88.1" r="8.0" fill="#2688ff" opacity="0.55"/><circle cx="223.0" cy="114.3" r="8.0" fill="#266bff" opacity="0.58"/><circle cx="223.0" cy="141.7" r="8.0" fill="#264dff" opacity="0.61"/><circle cx="215.3" cy="167.9" r="8.0" fill="#2630ff" opacity="0.63"/><circle cx="200.6" cy="190.9" r="8.0" fill="#3926ff" opacity="0.66"/><circle cx="179.9" cy="208.8" r="8.0" fill="#5726ff" opacity="0.69"/><circle cx="155.0" cy="220.1" r="8.0" fill="#7526ff" opacity="0.71"/><circle cx="128.0" cy="224.0" r="8.0" fill="#9226ff" opacity="0.74"/><circle cx="101.0" cy="220.1" r="8.0" fill="#b026ff" opacity="0.76"/><circle cx="76.1" cy="208.8" r="8.0" fill="#cd26ff" opacity="0.79"/><circle cx="55.4" cy="190.9" r="8.0" fill="#eb26ff" opacity="0.82"/><circle cx="40.7" cy="167.9" r="8.0" fill="#ff26f5" opacity="0.84"/><circle cx="33.0" cy="141.7" r="8.0" fill="#ff26d7" opacity="0.87"/><circle cx="33.0" cy="114.3" r="8.0" fill="#ff26ba" opacity="0.90"/><circle cx="40.7" cy="88.1" r="8.0" fill="#ff269c" opacity="0.92"/><circle cx="55.4" cy="65.1" r="8.0" fill="#ff267e" opacity="0.95"/><circle cx="76.1" cy="47.2" r="8.0" fill="#ff2661" opacity="0.97"/><circle cx="101.0" cy="35.9" r="8.0" fill="#ff2643" opacity="1.00"/><circle cx="128.0" cy="32.0" r="11.0" fill="#ffffff" opacity="1.00"/><circle cx="72.0" cy="100.0" r="5.6" fill="#26e4ff" opacity="1.00"/><circle cx="72.0" cy="114.0" r="5.6" fill="#26e4ff" opacity="1.00"/><circle cx="72.0" cy="128.0" r="5.6" fill="#26e4ff" opacity="1.00"/><circle cx="72.0" cy="142.0" r="5.6" fill="#26e4ff" opacity="1.00"/><circle cx="72.0" cy="156.0" r="5.6" fill="#26e4ff" opacity="1.00"/><circle cx="86.0" cy="156.0" r="5.6" fill="#26a3ff" opacity="1.00"/><circle cx="100.0" cy="156.0" r="5.6" fill="#2662ff" opacity="1.00"/><circle cx="128.0" cy="100.0" r="5.6" fill="#6b26ff" opacity="1.00"/><circle cx="184.0" cy="100.0" r="5.6" fill="#ff268e" opacity="1.00"/><circle cx="128.0" cy="114.0" r="5.6" fill="#6b26ff" opacity="1.00"/><circle cx="142.0" cy="114.0" r="5.6" fill="#ac26ff" opacity="1.00"/><circle cx="170.0" cy="114.0" r="5.6" fill="#ff26cf" opacity="1.00"/><circle cx="184.0" cy="114.0" r="5.6" fill="#ff268e" opacity="1.00"/><circle cx="128.0" cy="128.0" r="5.6" fill="#6b26ff" opacity="1.00"/><circle cx="156.0" cy="128.0" r="5.6" fill="#ed26ff" opacity="1.00"/><circle cx="184.0" cy="128.0" r="5.6" fill="#ff268e" opacity="1.00"/><circle cx="128.0" cy="142.0" r="5.6" fill="#6b26ff" opacity="1.00"/><circle cx="184.0" cy="142.0" r="5.6" fill="#ff268e" opacity="1.00"/><circle cx="128.0" cy="156.0" r="5.6" fill="#6b26ff" opacity="1.00"/><circle cx="184.0" cy="156.0" r="5.6" fill="#ff268e" opacity="1.00"/></g></svg>
      <span class="brand-name">openLedMapper<small class="brand-ver" id="appVer"></small></span>
    </div>
    <input id="projName" class="projname" type="text" aria-label="Project name">
    <div class="tb-group">
      <button class="btn ghost" id="btnFile" type="button">Project ▾</button>
      <button class="btn ghost icon" id="btnUndo" type="button" title="Undo (Ctrl+Z)" aria-label="Undo"><svg viewBox="0 0 16 16"><path d="M6 4L2.5 7.5 6 11M3 7.5h6.5a4 4 0 010 8H8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="btn ghost icon" id="btnRedo" type="button" title="Redo (Ctrl+Shift+Z)" aria-label="Redo"><svg viewBox="0 0 16 16"><path d="M10 4l3.5 3.5L10 11M13 7.5H6.5a4 4 0 000 8H8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
    <div class="spacer"></div>
    <span class="pill" id="bridgePill" title=""><span class="dot"></span><span id="bridgeText"></span></span>
    <div class="tb-sep"></div>
    <div class="hl" id="hl">
      <button class="btn" id="btnHl" type="button" aria-pressed="false"></button>
      <button class="btn" id="btnHlMode" type="button" title="Highlight mode" aria-label="Highlight mode" aria-haspopup="menu">▾</button>
    </div>
    <div class="master"><label for="master">Master</label><input id="master" type="range" min="0" max="1" step="0.01"><span class="mono" id="masterVal">100%</span></div>
    <button class="btn btn-bo" id="btnBlackout" type="button" title="Blackout (B)">Blackout</button>
    <button class="btn btn-out" id="btnOutput" type="button" title="Send Art-Net">Art-Net OFF</button>
  </header>

  <div class="workspace">
    <aside class="left">
      <section class="fixtures">
        <div class="phead"><h2>Fixtures</h2>
          <button class="btn sm" id="btnImportSvg" type="button" title="Import an SVG as fixtures and/or guide">SVG…</button>
          <button class="btn sm" id="btnAddFx" type="button">+ Add</button>
          <button class="btn sm grpbtn" id="btnGroup" type="button" disabled></button>
          <button class="btn sm grpbtn" id="btnLock" type="button" disabled></button>
        </div>
        <div class="pbody"><ul class="list" id="fxList"></ul></div>
      </section>
      <section class="sources">
        <div class="phead"><h2>Sources</h2><span class="meta" id="srcTarget"></span><button class="btn sm" id="btnAddSrc" type="button">+ Add</button></div>
        <div class="srcfind"><input id="srcFind" type="search" placeholder="Search: stars, sky, disco…" aria-label="Search sources by name or tag"><div class="srcfacets" id="srcFacets"></div></div>
        <div class="pbody"><div class="srcgrid" id="srcList"></div></div>
      </section>
    </aside>

    <main class="center">
      <div class="stagewrap">
        <div class="stagebar">
          <label><input type="checkbox" id="vContent"> Content</label>
          <input type="range" id="vContentOp" min="0" max="1" step="0.05" aria-label="Content opacity">
          <label><input type="checkbox" id="vGuide"> Guide</label>
          <input type="range" id="vGuideOp" min="0" max="1" step="0.05" aria-label="Guide opacity">
          <label><input type="checkbox" id="vGrid"> Grid</label>
          <label><input type="checkbox" id="vSnap"> Snap</label>
          <label><input type="checkbox" id="vLabels"> Labels</label>
          <label><input type="checkbox" id="vWiring"> Wiring</label>
          <label><input type="checkbox" id="vZones"> Zones</label>
          <span class="zoom" id="zoomLbl">100%</span>
          <button class="btn sm" id="btnFit" type="button" title="Fit (F)">Fit</button>
          <button class="btn sm icon" id="btnRight" type="button" title="Show or hide the Inspector / Content / Settings panel (H)" aria-label="Show or hide the right panel"></button>
        </div>
        <div class="stage" id="stage">
          <canvas id="view"></canvas>
          <div class="rail" id="rail">
            <button type="button" data-tool="select" data-key="V" title="Select / move (V)" aria-label="Select tool"><svg viewBox="0 0 18 18"><path d="M4 2.5l10 6.2-4.4 1 2.6 4.8-1.9 1-2.6-4.8L4.5 14z" fill="currentColor"/></svg></button>
            <hr>
            <button type="button" data-tool="line" data-key="L" title="Line / strip (L)" aria-label="Line tool"><svg viewBox="0 0 18 18"><path d="M3 15L15 3" stroke="currentColor" stroke-width="1.6"/><circle cx="3" cy="15" r="1.8" fill="currentColor"/><circle cx="7" cy="11" r="1.3" fill="currentColor"/><circle cx="11" cy="7" r="1.3" fill="currentColor"/><circle cx="15" cy="3" r="1.8" fill="currentColor"/></svg></button>
            <button type="button" data-tool="matrix" data-key="M" title="Matrix (M)" aria-label="Matrix tool"><svg viewBox="0 0 18 18"><g fill="currentColor"><circle cx="4" cy="4" r="1.5"/><circle cx="9" cy="4" r="1.5"/><circle cx="14" cy="4" r="1.5"/><circle cx="4" cy="9" r="1.5"/><circle cx="9" cy="9" r="1.5"/><circle cx="14" cy="9" r="1.5"/><circle cx="4" cy="14" r="1.5"/><circle cx="9" cy="14" r="1.5"/><circle cx="14" cy="14" r="1.5"/></g></svg></button>
            <button type="button" data-tool="circle" data-key="C" title="Circle / ring (C)" aria-label="Circle tool"><svg viewBox="0 0 18 18"><circle cx="9" cy="9" r="6" fill="none" stroke="currentColor" stroke-width="1.4"/><g fill="currentColor"><circle cx="9" cy="3" r="1.5"/><circle cx="15" cy="9" r="1.5"/><circle cx="9" cy="15" r="1.5"/><circle cx="3" cy="9" r="1.5"/></g></svg></button>
            <button type="button" data-tool="path" data-key="P" title="Path / free strip (P)" aria-label="Path tool"><svg viewBox="0 0 18 18"><path d="M2.5 14c3-8 5 2 8-4s4-6 5-6.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="2.5" cy="14" r="1.7" fill="currentColor"/><circle cx="15.5" cy="3.5" r="1.7" fill="currentColor"/></svg></button>
            <button type="button" data-tool="pen" data-key="N" title="Pen: curves, as in Illustrator (N)" aria-label="Pen tool"><svg viewBox="0 0 18 18"><path d="M2.5 15.5c1.5-6 4-9.5 7-10.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M9.5 5l3.5-3.5 3.5 3.5L13 8.5z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M5 8.5h7" stroke="currentColor" stroke-width="1" opacity=".6"/><circle cx="5" cy="8.5" r="1.4" fill="currentColor"/><circle cx="2.5" cy="15.5" r="1.7" fill="currentColor"/></svg></button>
            <hr>
            <button type="button" data-tool="zone" data-key="Z" title="Zones: draw, move and resize them (Z)" aria-label="Zone tool"><svg viewBox="0 0 18 18"><rect x="2.5" y="3.5" width="13" height="11" rx="1" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3 2"/><rect x="1" y="2" width="3" height="3" fill="currentColor"/><rect x="14" y="13" width="3" height="3" fill="currentColor"/></svg></button>
          </div>
          <div class="hint" id="hint" hidden></div>
        </div>
      </div>

      <section class="dock" id="dock">
        <div class="grip" id="dockGrip"></div>
        <div class="tabs" id="dockTabs">
          <button type="button" data-tab="scenes">Scenes</button>
          <button type="button" data-tab="patch">Patch</button>
          <button type="button" data-tab="nodes">Nodes</button>
          <button type="button" data-tab="monitor">DMX Monitor</button>
          <span class="fill"></span>
          <span class="tabtools"><button class="btn ghost sm" id="btnDock" type="button" title="Collapse panel">▾</button></span>
        </div>
        <div class="dockbody" id="dockBody"></div>
      </section>
    </main>

    <aside class="right">
      <div class="tabs" id="rightTabs">
        <button type="button" data-tab="inspector">Inspector</button>
        <button type="button" data-tab="content">Content</button>
        <button type="button" data-tab="settings">Settings</button>
        <span class="fill"></span>
        <span class="tabtools"><button class="btn ghost sm" id="btnHideRight" type="button" title="Hide this panel (H)" aria-label="Hide the right panel">»</button></span>
      </div>
      <div class="pbody" id="rightBody"></div>
    </aside>
  </div>

  <footer class="statusbar" id="status"></footer>
</div>
<div class="toasts" id="toasts"></div>
<input type="file" id="fileOpen" class="hide-file" accept=".json,application/json" tabindex="-1" aria-hidden="true">
<input type="file" id="fileIsf" class="hide-file" accept=".fs,.glsl,.txt" tabindex="-1" aria-hidden="true">
<input type="file" id="fileMedia" class="hide-file" accept=".mp4,.m4v,.mov,.webm,.mkv,.ogv,.png,.jpg,.jpeg,.gif,.webp,.avif,.bmp,image/*,video/*" tabindex="-1" aria-hidden="true">
<input type="file" id="fileSvg" class="hide-file" accept=".svg,image/svg+xml" tabindex="-1" aria-hidden="true">
<input type="file" id="fileGuide" class="hide-file" accept="image/*,.svg" tabindex="-1" aria-hidden="true">
<script src="js/vendor/isf.js"></script>
<script src="js/builtins.js"></script>
<script src="js/util.js"></script>
<script src="js/model.js"></script>
<script src="js/geometry.js"></script>
<script src="js/patch.js"></script>
<script src="js/sources.js"></script>
<script src="js/render.js"></script>
<script src="js/output.js"></script>
<script src="js/project-io.js"></script>
<script src="js/actions.js"></script>
<script src="js/ui-forms.js"></script>
<script src="js/ui-stage.js"></script>
<script src="js/ui-lists.js"></script>
<script src="js/ui-inspector.js"></script>
<script src="js/ui-dock.js"></script>
<script src="js/ui-menus.js"></script>
<script src="js/app.js"></script>
</body>
</html>
