<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>nouPix</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Cpath d=%22M0.5,8 L8,0.5 L63.5,0.5 L63.5,56 L56,63.5 L0.5,63.5 Z%22 fill=%22%23000000%22 stroke=%22%232C2C2C%22 stroke-width=%221.6%22/%3E%3Ccircle cx=%2232%22 cy=%2232%22 r=%2225%22 fill=%22none%22 stroke=%22%23F0F0F0%22 stroke-width=%224.2%22/%3E%3Cpath d=%22M2,32 H21 M39,32 H62 M21,21 L39,32 L21,43 Z M39,21 V43%22 fill=%22none%22 stroke=%22%23F0F0F0%22 stroke-width=%224.2%22 stroke-linejoin=%22miter%22/%3E%3Cpath d=%22M28.03,20.02 L29.01,18.17 M34.87,24.2 L35.85,22.35%22 fill=%22none%22 stroke=%22%23FF3B3B%22 stroke-width=%224.2%22/%3E%3Cpath d=%22M32.96,10.75 L32.35,19.94 L25.67,16.39 Z M39.8,14.93 L39.19,24.12 L32.51,20.57 Z%22 fill=%22%23FF3B3B%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/fonts.css">
<!-- the look chosen on this computer, before anything is drawn (ui.theme, saved with the preferences) -->
<script>try { if ((JSON.parse(localStorage.getItem('noupix.ui')) || {}).theme === 'light') document.documentElement.dataset.theme = 'light'; } catch (e) { /* storage off */ }</script>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <svg class="brand-icon" width="24" height="24" viewBox="0 0 64 64" aria-hidden="true"><path d="M0.5,8 L8,0.5 L63.5,0.5 L63.5,56 L56,63.5 L0.5,63.5 Z" style="fill:var(--bg0);stroke:var(--line2)" stroke-width="1.6"/><circle cx="32" cy="32" r="25" fill="none" stroke="currentColor" stroke-width="2.58"/><path d="M2,32 H21 M39,32 H62 M21,21 L39,32 L21,43 Z M39,21 V43" fill="none" stroke="currentColor" stroke-width="2.58" stroke-linejoin="miter"/><path d="M28.32,21.15 L30.83,16.44 M33.72,24.45 L36.23,19.74" fill="none" style="stroke:var(--accent)" stroke-width="2.58"/><path d="M33.25,11.88 L32.88,17.53 L28.78,15.35 Z M38.65,15.18 L38.28,20.83 L34.18,18.65 Z" style="fill:var(--accent)"/></svg>
      <span class="brand-name"><svg class="brand-word" viewBox="-1.8 7.2 78.6 18.6" width="63.4" height="15" role="img" aria-label="nouPix"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="miter" d="M0,24 L0,16 L2.5,13.5 L11.5,13.5 L11.5,24 M15,16 L17.5,13.5 L26.5,13.5 L26.5,21.5 L24,24 L15,24 Z M30,13.5 L30,24 L39,24 L41.5,21.5 L41.5,13.5 M45,24 L45,11.5 L47.5,9 L56.5,9 L56.5,15.5 L54,18 L45,18 M60,13.5 L60,24"/><rect x="58.85" y="9.2" width="2.3" height="2.3" rx="0.92" style="fill:var(--accent)"/><g fill="currentColor"><rect x="62.35" y="12.35" width="2.3" height="2.3" rx="0.92"/><rect x="65.225" y="14.975" width="2.3" height="2.3" rx="0.92"/><rect x="68.1" y="17.6" width="2.3" height="2.3" rx="0.92"/><rect x="70.975" y="20.225" width="2.3" height="2.3" rx="0.92"/><rect x="73.85" y="22.85" width="2.3" height="2.3" rx="0.92"/><rect x="73.85" y="12.35" width="2.3" height="2.3" rx="0.92"/><rect x="70.975" y="14.975" width="2.3" height="2.3" rx="0.92"/><rect x="65.225" y="20.225" width="2.3" height="2.3" rx="0.92"/><rect x="62.35" y="22.85" width="2.3" height="2.3" rx="0.92"/></g></svg><small class="brand-ver" id="appVer"></small></span>
    </div>
    <input id="projName" class="projname" type="text" aria-label="Project name">
    <div class="tb-group">
      <button class="btn ghost" id="btnFile" type="button">Project ▾</button>
      <button class="btn ghost icon" id="btnUndo" type="button" title="Undo (Ctrl+Z)" aria-label="Undo"><svg viewBox="0 0 16 16"><path d="M6 4L2.5 7.5 6 11M3 7.5h6.5a4 4 0 010 8H8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="btn ghost icon" id="btnRedo" type="button" title="Redo (Ctrl+Shift+Z)" aria-label="Redo"><svg viewBox="0 0 16 16"><path d="M10 4l3.5 3.5L10 11M13 7.5H6.5a4 4 0 000 8H8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
    <div class="spacer"></div>
    <button class="btn ghost icon" id="btnTheme" type="button" aria-label="White interface" aria-pressed="false"></button>
    <button class="btn ghost icon rbtn" id="btnRemote" type="button" aria-label="Remote control" aria-haspopup="menu"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><rect x="2" y="4.2" width="6.6" height="10.3" rx="1.4"/><path d="M4.6 12.4h1.4"/><path d="M10.6 5.4a2.4 2.4 0 0 1 0 3.4"/><path d="M12.4 3.6a5 5 0 0 1 0 7"/></svg><span class="rcount" id="remoteCount" hidden></span></button>
    <button class="btn ghost icon rbtn" id="btnMidi" type="button" aria-label="MIDI"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M4 2.5v11M8 2.5v11M12 2.5v11"/><rect x="2.3" y="8.6" width="3.4" height="2.6" rx=".7" fill="currentColor" stroke="none"/><rect x="6.3" y="4" width="3.4" height="2.6" rx=".7" fill="currentColor" stroke="none"/><rect x="10.3" y="6.6" width="3.4" height="2.6" rx=".7" fill="currentColor" stroke="none"/></svg><span class="mled" id="midiLed"></span></button>
    <div class="tb-sep"></div>
    <div class="hl" id="hl">
      <button class="btn" id="btnHl" type="button" aria-pressed="false"></button>
      <button class="btn" id="btnHlMode" type="button" title="Highlight mode" aria-label="Highlight mode" aria-haspopup="menu">▾</button>
    </div>
    <div class="master"><label for="master">Master</label><span class="mslot" data-midi="master"><input id="master" type="range" min="0" max="1" step="0.01"><i class="fline" hidden></i><span class="ftag" hidden></span></span><span class="mono" id="masterVal">100%</span></div>
    <button class="btn btn-bo icon" id="btnBlackout" type="button" data-tip="Blackout · B|Every light off at once, whatever plays. Again to bring them back." aria-label="Blackout" aria-pressed="false" data-midi="blackout"><span class="ftag" hidden></span><svg viewBox="0 0 18 18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="9" cy="9" r="5.5"/><path d="M9 1v2M9 15v2M1 9h2M15 9h2"/><path d="M2.5 2.5l13 13" stroke-width="1.7"/></svg></button>
  </header>

  <div class="workspace">
    <aside class="left">
      <section class="fixtures">
        <div class="phead"><h2>Fixtures</h2>
          <button class="btn sm" id="btnImportSvg" type="button" title="Import an SVG as fixtures and/or guide">SVG…</button>
          <button class="btn sm" id="btnAddFx" type="button">+ Add</button>
          <button class="btn sm grpbtn" id="btnGroup" type="button" disabled></button>
          <button class="btn sm grpbtn" id="btnLock" type="button" disabled></button>
        </div>
        <div class="pbody"><ul class="list" id="fxList"></ul></div>
      </section>
      <section class="sources">
        <div class="grip" id="srcGrip" title="Drag to make the sources taller or shorter; double-click for the usual height"></div>
        <div class="phead"><h2>Sources</h2><span class="meta" id="srcTarget"></span><button class="btn sm" id="btnAddSrc" type="button">+ Add</button></div>
        <div class="srcfind"><input id="srcFind" type="search" placeholder="Search: stars, sky, disco…" aria-label="Search sources by name or tag"><div class="srcfacets" id="srcFacets"></div></div>
        <div class="pbody"><div class="srcgrid" id="srcList"></div></div>
      </section>
    </aside>

    <main class="center">
      <div class="stagewrap">
        <div class="stagebar">
          <label class="vt" data-tip="Content|What plays, shown behind the fixtures. Off: only the LEDs’ light. The slider mixes between the two."><input type="checkbox" id="vContent" aria-label="Content"><svg viewBox="0 0 18 18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2.5" y="2.5" width="13" height="13"/><path d="M9 2.5v13"/><path d="M2.5 12.5l2.5-3 2 2 2-2.5"/><circle cx="5.6" cy="5.8" r="1" fill="currentColor" stroke="none"/><g fill="currentColor" stroke="none"><circle cx="12.25" cy="5.5" r="1.25"/><circle cx="12.25" cy="9" r="1.25"/><circle cx="12.25" cy="12.5" r="1.25"/></g></svg></label>
          <input type="range" id="vContentOp" min="0" max="1" step="0.05" aria-label="Content opacity" data-tip="Content opacity|How strongly the content shows behind the fixtures.">
          <span class="vsep"></span>
          <label class="vt" data-tip="Guide|Your layout image over the canvas, to trace fixtures on. Load it and set its opacity in Settings → Stage."><input type="checkbox" id="vGuide" aria-label="Guide image"><svg viewBox="0 0 18 18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2.5" y="2.5" width="13" height="13" stroke-dasharray="2 1.6"/><path d="M5.5 12.5l7-7M10 5.5h2.5V8"/></svg></label>
          <label class="vt" data-tip="Grid|Lines over the canvas. Their spacing is in Settings → Stage."><input type="checkbox" id="vGrid" aria-label="Grid"><svg viewBox="0 0 18 18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2.5 6.5h13M2.5 11.5h13M6.5 2.5v13M11.5 2.5v13"/></svg></label>
          <label class="vt" data-tip="Snap · G|Fixtures and points jump to the grid as you move them. Hold Alt to place them freely."><input type="checkbox" id="vSnap" aria-label="Snap to grid"><svg viewBox="0 0 18 18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4.5 4.5v5a4.5 4.5 0 009 0v-5"/><path d="M3.5 2.5h3v2.5h-3zM11.5 2.5h3v2.5h-3z" fill="currentColor" stroke="none"/></svg></label>
          <label class="vt" data-tip="Labels|Each fixture’s name on the stage."><input type="checkbox" id="vLabels" aria-label="Labels"><svg viewBox="0 0 18 18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2.5 4.5h8.5l4.5 4.5-4.5 4.5H2.5z"/><circle cx="6" cy="9" r="1.2" fill="currentColor" stroke="none"/></svg></label>
          <label class="vt" data-tip="Wiring|Where each fixture’s data starts, which way it runs, and the cable between fixtures on one output."><input type="checkbox" id="vWiring" aria-label="Wiring"><svg viewBox="0 0 18 18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3.5 14.5L8 10h3l3.5-5.5"/><path d="M11.5 4.5h3v3"/><circle cx="3.5" cy="14.5" r="1.6" fill="currentColor" stroke="none"/></svg></label>
          <label class="vt" data-tip="Zones|The zones’ outlines and names. The Zone tool (Z) shows them anyway."><input type="checkbox" id="vZones" aria-label="Zones"><svg viewBox="0 0 18 18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2.5" y="2.5" width="9" height="8" stroke-dasharray="2 1.6"/><rect x="6.5" y="7.5" width="9" height="8"/></svg></label>
          <span class="zoom" id="zoomLbl">100%</span>
          <button class="btn sm" id="btnFit" type="button" data-tip="Fit · F|Shows the whole canvas.">Fit</button>
          <button class="btn sm icon" id="btnRight" type="button" data-tip="Side panel · H|Shows or hides the Inspector, Content and Settings." aria-label="Show or hide the right panel"></button>
        </div>
        <div class="stage" id="stage">
          <canvas id="view"></canvas>
          <div class="rail" id="rail">
            <button type="button" data-tool="select" data-key="V" title="Select / move (V)" aria-label="Select tool"><svg viewBox="0 0 18 18"><path d="M4 2.5l10 6.2-4.4 1 2.6 4.8-1.9 1-2.6-4.8L4.5 14z" fill="currentColor"/></svg></button>
            <hr>
            <button type="button" data-tool="line" data-key="L" title="Line / strip (L)" aria-label="Line tool"><svg viewBox="0 0 18 18"><path d="M3 15L15 3" stroke="currentColor" stroke-width="1.6"/><circle cx="3" cy="15" r="1.8" fill="currentColor"/><circle cx="7" cy="11" r="1.3" fill="currentColor"/><circle cx="11" cy="7" r="1.3" fill="currentColor"/><circle cx="15" cy="3" r="1.8" fill="currentColor"/></svg></button>
            <button type="button" data-tool="matrix" data-key="M" title="Matrix (M)" aria-label="Matrix tool"><svg viewBox="0 0 18 18"><g fill="currentColor"><circle cx="4" cy="4" r="1.5"/><circle cx="9" cy="4" r="1.5"/><circle cx="14" cy="4" r="1.5"/><circle cx="4" cy="9" r="1.5"/><circle cx="9" cy="9" r="1.5"/><circle cx="14" cy="9" r="1.5"/><circle cx="4" cy="14" r="1.5"/><circle cx="9" cy="14" r="1.5"/><circle cx="14" cy="14" r="1.5"/></g></svg></button>
            <button type="button" data-tool="circle" data-key="C" title="Circle / ring (C)" aria-label="Circle tool"><svg viewBox="0 0 18 18"><circle cx="9" cy="9" r="6" fill="none" stroke="currentColor" stroke-width="1.4"/><g fill="currentColor"><circle cx="9" cy="3" r="1.5"/><circle cx="15" cy="9" r="1.5"/><circle cx="9" cy="15" r="1.5"/><circle cx="3" cy="9" r="1.5"/></g></svg></button>
            <button type="button" data-tool="path" data-key="P" title="Path / free strip (P)" aria-label="Path tool"><svg viewBox="0 0 18 18"><path d="M2.5 14c3-8 5 2 8-4s4-6 5-6.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="2.5" cy="14" r="1.7" fill="currentColor"/><circle cx="15.5" cy="3.5" r="1.7" fill="currentColor"/></svg></button>
            <button type="button" data-tool="pen" data-key="N" title="Pen: curves, as in Illustrator (N)" aria-label="Pen tool"><svg viewBox="0 0 18 18"><path d="M2.5 15.5c1.5-6 4-9.5 7-10.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M9.5 5l3.5-3.5 3.5 3.5L13 8.5z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M5 8.5h7" stroke="currentColor" stroke-width="1" opacity=".6"/><circle cx="5" cy="8.5" r="1.4" fill="currentColor"/><circle cx="2.5" cy="15.5" r="1.7" fill="currentColor"/></svg></button>
            <hr>
            <button type="button" data-tool="zone" data-key="Z" title="Zones: draw, move and resize them (Z)" aria-label="Zone tool"><svg viewBox="0 0 18 18"><rect x="2.5" y="3.5" width="13" height="11" rx="1" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3 2"/><rect x="1" y="2" width="3" height="3" fill="currentColor"/><rect x="14" y="13" width="3" height="3" fill="currentColor"/></svg></button>
          </div>
          <div class="hint" id="hint" hidden></div>
        </div>
      </div>

      <section class="dock" id="dock">
        <div class="grip" id="dockGrip"></div>
        <div class="tabs" id="dockTabs">
          <button type="button" data-tab="scenes">Scenes</button>
          <button type="button" data-tab="patch">Patch</button>
          <button type="button" data-tab="nodes">Nodes</button>
          <button type="button" data-tab="monitor">DMX Monitor</button>
          <span class="fill"></span>
          <span class="tabtools"><button class="btn ghost sm" id="btnDock" type="button" title="Collapse panel">▾</button></span>
        </div>
        <div class="dockbody" id="dockBody"></div>
      </section>
    </main>

    <aside class="right">
      <div class="tabs" id="rightTabs">
        <button type="button" data-tab="inspector">Inspector</button>
        <button type="button" data-tab="content">Content</button>
        <button type="button" data-tab="settings">Settings</button>
        <span class="fill"></span>
        <span class="tabtools"><button class="btn ghost sm" id="btnHideRight" type="button" title="Hide this panel (H)" aria-label="Hide the right panel">»</button></span>
      </div>
      <div class="pbody" id="rightBody"></div>
    </aside>
  </div>

  <footer class="statusbar"><span id="status"></span><span class="pill" id="bridgePill" title="" hidden><span class="dot"></span><span id="bridgeText"></span></span></footer>
</div>
<div class="toasts" id="toasts"></div>
<input type="file" id="fileOpen" class="hide-file" accept=".noupix,.json,application/json" tabindex="-1" aria-hidden="true">
<input type="file" id="fileIsf" class="hide-file" accept=".fs,.glsl,.txt" tabindex="-1" aria-hidden="true">
<input type="file" id="fileMedia" class="hide-file" accept=".mp4,.m4v,.mov,.webm,.mkv,.ogv,.png,.jpg,.jpeg,.gif,.webp,.avif,.bmp,image/*,video/*" tabindex="-1" aria-hidden="true">
<input type="file" id="fileSvg" class="hide-file" accept=".svg,image/svg+xml" tabindex="-1" aria-hidden="true">
<input type="file" id="fileGuide" class="hide-file" accept="image/*,.svg" tabindex="-1" aria-hidden="true">
<script src="js/vendor/isf.js"></script>
<script src="js/builtins.js"></script>
<script src="js/util.js"></script>
<script src="js/model.js"></script>
<script src="js/macros.js"></script>
<script src="js/geometry.js"></script>
<script src="js/patch.js"></script>
<script src="js/sources.js"></script>
<script src="js/render.js"></script>
<script src="js/output.js"></script>
<script src="js/project-io.js"></script>
<script src="js/remote.js"></script>
<script src="js/playlists.js"></script>
<script src="js/midi.js"></script>
<script src="js/actions.js"></script>
<script src="js/ui-forms.js"></script>
<script src="js/ui-color.js"></script>
<script src="js/ui-stage.js"></script>
<script src="js/ui-lists.js"></script>
<script src="js/ui-inspector.js"></script>
<script src="js/ui-dock.js"></script>
<script src="js/ui-playlists.js"></script>
<script src="js/ui-menus.js"></script>
<script src="js/ui-remote.js"></script>
<script src="js/ui-midi.js"></script>
<script src="js/ui-bay.js"></script>
<script src="js/ui-macros.js"></script>
<script src="js/app.js"></script>
</body>
</html>
