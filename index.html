<script>
/* ---------- opening project files ---------- */
const uniqueId = (v, seen) => { const id = isId(v) && !seen.has(v) ? v : uid(); seen.add(id); return id; };
function fixSettings(given) {
  const s = Object.assign(JSON.parse(JSON.stringify(DEFAULT_SETTINGS)), isObj(given) ? given : {});
  for (const [k, d] of Object.entries(DEFAULT_SETTINGS)) {
    if (typeof d === 'number') s[k] = numOr(s[k], d);
    else if (typeof d === 'string' && typeof s[k] !== 'string') s[k] = d;
  }
  s.compW = clamp(Math.round(s.compW), 16, 8192); s.compH = clamp(Math.round(s.compH), 16, 8192);
  s.fps = clamp(s.fps, 1, 100);
  if (!['off', 'sub', 'add'].includes(s.whiteMode)) s.whiteMode = 'off';
  // 255.255.255.255 was the default address for ArtPoll; discovery now goes to the networks chosen in Nodes
  if (s.broadcast.trim() === '255.255.255.255') s.broadcast = '';
  delete s.trim;   // the colour trims are per fixture now (see hydrate)
  return s;
}
let legacyTrim = [1, 1, 1, 1];
// Gamma is set per fixture (LED types differ). Files from before had one gamma for all: each fixture starts from it.
let legacyGamma = 1;
function fixFixture(f, i, ids) {
  const fields = FIXTURE_FIELDS[f.type];
  for (const [k, d] of Object.entries(fields)) {
    if (typeof d === 'number') f[k] = numOr(f[k], d);
    else if (typeof d === 'string') { if (typeof f[k] !== 'string') f[k] = d; }
    else if (!(k in f)) f[k] = JSON.parse(JSON.stringify(d));
  }
  // at most a million pixels per fixture: a typo like 1e9 would not fit in memory
  if (f.type === 'matrix') {
    f.cols = Math.min(f.cols, 4096); f.rows = Math.min(f.rows, Math.floor(1e6 / Math.max(1, f.cols | 0)));
    if (!['TL', 'TR', 'BL', 'BR'].includes(f.start)) f.start = 'TL';
    if (f.dir !== 'H' && f.dir !== 'V') f.dir = 'H';
  } else f.pixels = Math.min(f.pixels, 1e6);
  if (f.type === 'circle' && 'ry' in f) { const ry = numOr(f.ry, NaN); if (ry > 0) f.ry = ry; else delete f.ry; }
  if (f.type === 'circle' && 'rot' in f) { const r = numOr(f.rot, 0); if (r) f.rot = r; else delete f.rot; }   // an oval turned
  if (f.type === 'path') {
    const P = Array.isArray(f.pts) && f.pts.every(v => typeof v === 'number' && isFinite(v)) ? f.pts : (Array.isArray(f.pts) ? f.pts : []).map(v => numOr(v, NaN)).filter(isFinite);
    if (P.length % 2) P.pop();
    f.pts = P.length >= 2 ? P : [0, 0, 100, 0];
    const H = f.ctl;
    if (!(Array.isArray(H) && H.length === f.pts.length * 2 && H.every(v => typeof v === 'number' && isFinite(v)) && H.some(v => v !== 0))) delete f.ctl;
  }
  f.id = uniqueId(isId(f.id) ? String(f.id) : null, ids);   // ids are text, as the list and patch panel hold them
  if (typeof f.name !== 'string') f.name = f.name != null ? String(f.name) : TYPE_LABEL[f.type] + ' ' + (i + 1);
  if (typeof f.tag !== 'string') f.tag = TAGS[i % TAGS.length];
  if (!ORDERS.includes(f.order)) { const o = String(f.order || '').toUpperCase(); f.order = ORDERS.includes(o) ? o : 'RGB'; }
  f.dimmer = numOr(f.dimmer, 1);
  if (isObj(f.addr)) f.addr = { u: clamp(Math.round(numOr(f.addr.u, 0)), 0, 32767), ch: clamp(Math.round(numOr(f.addr.ch, 1)), 1, 512) }; else delete f.addr;
  f.trim = [0, 1, 2, 3].map(i => clamp(numOr(Array.isArray(f.trim) ? f.trim[i] : undefined, legacyTrim[i]), 0, 1));
  f.gamma = clampGamma(numOr(f.gamma, legacyGamma));
  if (!('enabled' in f)) f.enabled = true;
  if (!('locked' in f)) f.locked = false;
  if (!('reverse' in f)) f.reverse = false;
  return f;
}
function fixController(c, i, ids) {
  c.id = uniqueId(c.id, ids);
  if (typeof c.name !== 'string') c.name = c.name != null ? String(c.name) : 'Controller ' + String.fromCharCode(65 + (i % 26));
  if (typeof c.ip !== 'string') c.ip = c.ip != null ? String(c.ip) : '';
  if (!('enabled' in c)) c.enabled = true;
  if (!('split' in c)) c.split = false;
  // the universes the device reported to discovery: a reminder for setting outputs and universes per output
  if ('discovered' in c) {
    const u = Array.isArray(c.discovered) ? [...new Set(c.discovered.map(v => Math.round(numOr(v, -1))).filter(v => v >= 0 && v <= 32767))].sort((a, b) => a - b) : [];
    if (u.length) c.discovered = u; else delete c.discovered;
  }
  if (Array.isArray(c.chains)) c.chains = c.chains.map(ch => (Array.isArray(ch) ? ch.filter(isId).map(String) : []));
  ensureChains(c);
  return c;
}
function hydrate(p) {
  if (!isObj(p)) p = {};
  const base = blankProject(typeof p.name === 'string' && p.name ? p.name : 'Untitled');
  const out = Object.assign(base, p);
  if (typeof out.name !== 'string') out.name = base.name;
  out.format = base.format; out.version = base.version; // the file's structure is brought up to date below
  if (out.guide != null && !isObj(out.guide)) out.guide = null;
  out.settings = fixSettings(p.settings);
  // up to 0.4 the red, green and blue trims were one setting for all fixtures: each fixture starts from it
  const gt = isObj(p.settings) && Array.isArray(p.settings.trim) ? p.settings.trim : [];
  legacyTrim = [0, 1, 2].map(i => clamp(numOr(gt[i], 1), 0, 1)).concat(1);
  legacyGamma = clampGamma(out.settings.gamma);
  const fxIds = new Set(), ctrlIds = new Set();
  out.fixtures = (Array.isArray(p.fixtures) ? p.fixtures : []).filter(f => isObj(f) && TYPE_LABEL[f.type]).map((f, i) => fixFixture(f, i, fxIds));
  out.controllers = (Array.isArray(p.controllers) ? p.controllers : []).filter(isObj).map((c, i) => fixController(c, i, ctrlIds));
  const grpIds = new Set();
  for (const f of out.fixtures) { if (isId(f.group)) f.group = String(f.group); else delete f.group; }
  out.groups = (Array.isArray(p.groups) ? p.groups : []).filter(isObj).map((g, i) => ({
    id: uniqueId(isId(g.id) ? String(g.id) : null, grpIds), name: typeof g.name === 'string' ? g.name : 'Group ' + (i + 1),
    tag: typeof g.tag === 'string' ? g.tag : TAGS[(i + 2) % TAGS.length], open: g.open !== false,
    ...(numOr(g.rot, 0) ? { rot: numOr(g.rot, 0) } : {}) }));
  normalizeGroups(out);
  const builtins = builtinSources(), srcIds = new Set(builtins.map(s => s.id));
  const custom = (Array.isArray(p.sources) ? p.sources : []).filter(s => isObj(s) && !s.builtin && isId(s.id) && !srcIds.has(s.id) && srcIds.add(s.id));
  for (const s of custom) {
    if (!['isf', 'image', 'video', 'screen'].includes(s.kind)) s.kind = 'image';
    if (typeof s.name !== 'string') s.name = s.name != null ? String(s.name) : 'Source';
    if (s.kind === 'isf' && typeof s.code !== 'string') s.code = '';
    if ('rate' in s) s.rate = numOr(s.rate, 1);
    if (s.kind === 'video') fixVideoOptions(s);
  }
  out.sources = builtins.concat(custom);
  if (!Array.isArray(p.zones)) { // 0.2 and older: one set of layers and scenes for the whole canvas
    let layers = p.layers;
    if (!Array.isArray(layers)) { // 0.1: one live source, parameters stored on the sources
      const L = newLayer(p.activeSource || 'b-rainbow');
      for (const s of Array.isArray(p.sources) ? p.sources : []) if (isObj(s) && isObj(s.params) && Object.keys(s.params).length) L.params[s.id] = s.params;
      layers = [L];

    if (r > 0.5 && (rmax - rmin) / r < 0.04) {
      const ang = i => Math.atan2(P[2 * i] - cx, -(P[2 * i + 1] - cy)) * 180 / Math.PI;
      let sweep = 0;
      for (let i = 1; i < n; i++) { let d = ang(i) - ang(i - 1); d = ((d + 540) % 360) - 180; sweep += d; }
      const full = closed || Math.abs(sweep) > 355;
      const f = newFixture('circle', { cx, cy, r, start: ((ang(0) % 360) + 360) % 360, sweep: full ? 360 : Math.abs(sweep), ccw: sweep < 0 });
      f.pixels = Math.max(3, Math.round(fixtureLength(f) / pitch) + (full ? 0 : 1));
      if (label) f.name = label;
      return f;
    }
    // a closed oval, upright (its axes horizontal and vertical): the half width and half height of its box
    if (closed) {
      let x0b = Infinity, x1b = -Infinity, y0b = Infinity, y1b = -Infinity;
      for (let i = 0; i < n; i++) { x0b = Math.min(x0b, P[2 * i]); x1b = Math.max(x1b, P[2 * i]); y0b = Math.min(y0b, P[2 * i + 1]); y1b = Math.max(y1b, P[2 * i + 1]); }
      const ox = (x0b + x1b) / 2, oy = (y0b + y1b) / 2, rx = (x1b - x0b) / 2, ry = (y1b - y0b) / 2;
      let worst = 0;
      if (rx > 0.5 && ry > 0.5) for (let i = 0; i < n; i++) worst = Math.max(worst, Math.abs(Math.hypot((P[2 * i] - ox) / rx, (P[2 * i + 1] - oy) / ry) - 1));
      if (rx > 0.5 && ry > 0.5 && worst < 0.03) {
        const ang = i => Math.atan2((P[2 * i] - ox) / rx, -(P[2 * i + 1] - oy) / ry) * 180 / Math.PI;
        let turn = 0;
        for (let i = 1; i < n; i++) { let d = ang(i) - ang(i - 1); d = ((d + 540) % 360) - 180; turn += d; }
        const f = newFixture('circle', { cx: ox, cy: oy, r: rx, ry, start: ((ang(0) % 360) + 360) % 360, sweep: 360, ccw: turn < 0 });
        f.pixels = Math.max(3, Math.round(fixtureLength(f) / pitch));
        if (label) f.name = label;
        return f;
      }
    }
  }
  // straight line
  const chord = Math.hypot(xN - x0, yN - y0);
  if (!closed && chord > 0.5) {
    let dev = 0;
    for (let i = 0; i < n; i++) dev = Math.max(dev, distSeg(P[2 * i], P[2 * i + 1], x0, y0, xN, yN));
    if (dev < Math.max(0.5, chord * 0.01) && len < chord * 1.02) {
      const f = newFixture('line', { x1: x0, y1: y0, x2: xN, y2: yN });
      f.pixels = Math.max(2, Math.round(chord / pitch) + 1);
      if (label) f.name = label;
      return f;
    }
  }
  // free path: simplify to at most 120 points
  const step = Math.max(1, Math.ceil(n / 120));
  const pts = [];
  for (let i = 0; i < n - (closed ? 1 : 0); i += step) pts.push(P[2 * i], P[2 * i + 1]);
  if (!closed && (pts[pts.length - 2] !== xN || pts[pts.length - 1] !== yN)) pts.push(xN, yN);
  const f = newFixture('path', { pts, closed });
  f.pixels = Math.max(2, Math.round(len / pitch) + (closed ? 0 : 1));
  if (label) f.name = label;
  return f;
}

/* ============================================================ menus */
// A menu under an element (a button), or at a point (a right-click: { x, y } in window pixels).
// Items: [label, action, { key, danger, disabled }], [label, null, { sub: items }] for a submenu, '-' for a line,
// { head: text } for a title; false is left out.
function menu(anchor, items) {
  $$('.menu').forEach(m => m.remove());
  const open = [];   // the menu and the submenus open from it, outermost first
  const close = () => { open.splice(0).forEach(m => m.remove()); document.removeEventListener('pointerdown', off, true); removeEventListener('keydown', esc, true); removeEventListener('blur', close); removeEventListener('resize', close); };
  const off = e => { if (!open.some(m => m.contains(e.target))) close(); };
  const esc = e => { if (e.key === 'Escape') { e.stopPropagation(); close(); } };
  const show = (items, level, from) => {
    open.splice(level).forEach(m => m.remove());
    const list = items.filter(Boolean).filter((it, i, a) => it !== '-' || (i > 0 && i < a.length - 1 && a[i - 1] !== '-' && !a[i - 1].head));
    const m = h('div', { class: 'menu', role: 'menu' }, list.map(it => {
      if (it === '-') return h('hr');
      if (it.head) return h('div', { class: 'mh' }, it.head);
      const o = it[2] || {};
      const b = h('button', { type: 'button', role: 'menuitem', class: o.danger ? 'danger' : '', disabled: !!o.disabled, title: o.title, 'aria-haspopup': o.sub ? 'menu' : null },
        it[0], o.sub ? h('span', { class: 'sm' }, '▸') : o.key ? h('span', { class: 'mk' }, o.key) : null);
      const openSub = () => { $$('button.open', m).forEach(x => x.classList.remove('open')); b.classList.add('open'); show(o.sub, level + 1, b); };
      b.addEventListener('pointerenter', () => { if (o.sub) openSub(); else if (open.length > level + 1) { $$('button.open', m).forEach(x => x.classList.remove('open')); open.splice(level + 1).forEach(x => x.remove()); } });
      b.addEventListener('click', () => { if (o.sub) openSub(); else { close(); it[1](); } });
      return b;
    }));
    document.body.append(m);
    open.push(m);
    const w = m.offsetWidth, ht = m.offsetHeight;
    if (level > 0) {   // beside the item it opens from
      const r = from.getBoundingClientRect();
      m.style.left = (r.right + w - 2 > innerWidth - 8 ? Math.max(8, r.left - w + 2) : r.right - 2) + 'px';
      m.style.top = Math.max(8, Math.min(r.top - 5, innerHeight - ht - 8)) + 'px';
    } else if (!(from instanceof Element)) {
      m.style.left = Math.max(8, Math.min(from.x, innerWidth - w - 8)) + 'px';
      m.style.top = Math.max(8, from.y + ht > innerHeight - 8 ? from.y - ht : from.y) + 'px';
    } else {
      const r = from.getBoundingClientRect();
      m.style.left = Math.min(r.left, innerWidth - w - 8) + 'px';
      m.style.top = (r.bottom + 4 + ht > innerHeight - 8 ? Math.max(8, r.top - ht - 4) : r.bottom + 4) + 'px';
    }
  };
  show(items, 0, anchor);
  setTimeout(() => { document.addEventListener('pointerdown', off, true); addEventListener('keydown', esc, true); addEventListener('blur', close); addEventListener('resize', close); }, 0);
}

// The fixtures are drawn in list order, the last on top. A whole group moves as one; fixtures picked out of a

function restackSel(front) {

  let F = project.fixtures.slice();

function pasteFixtures(d, point) {

  const gnames = new Set(project.groups.map(g => groupName(g)));
  const gmap = new Map((Array.isArray(d.groups) ? d.groups : []).filter(g => isObj(g) && isId(g.id)).map((g, i) => [String(g.id),
    { id: uid(), name: typeof g.name === 'string' && g.name ? (gnames.has(g.name) ? nextCopyName(g.name, gnames) : g.name) : nextGroupName(), tag: typeof g.tag === 'string' ? g.tag : TAGS[(project.groups.length + 2 + i) % TAGS.length], open: true,
      ...(Number.isFinite(g.rot) && g.rot ? { rot: wrap180(g.rot) } : {}) }]));
  const list = d.fixtures.filter(f => isObj(f) && TYPE_LABEL[f.type]).map((f0, i) => {
    const f = JSON.parse(JSON.stringify(f0));

function onKey(e) {
  const t = e.target;
  const typing = t && (t.tagName === 'INPUT' && !['checkbox', 'range', 'color'].includes(t.type) || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT');
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key.toLowerCase() === 's') { e.preventDefault(); saveProjectFile(); return; }
  if (typing) return;
  if ($('.modal-bg')) { if (e.key === 'Escape') $('.modal-bg').remove(); return; }
  const k = e.key.toLowerCase();
  if (mod && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && k === 'y') { e.preventDefault(); redo(); return; }
  if (mod && k === 'd') { e.preventDefault(); duplicateSel(); return; }
  if (mod && k === 'g') { e.preventDefault(); e.shiftKey ? ungroupSel() : groupSel(); return; }
  if (mod && k === 'l') { e.preventDefault(); toggleLockSel(); return; }
  if (mod && k === 'a') { e.preventDefault(); ui.sel = new Set(project.fixtures.filter(f => !f.locked).map(f => f.id)); onSelection(); return; }
  if (mod) return;
  const digit = /^Digit([1-9])$/.exec(e.code);
  if (digit) { const z = selZone(), sc = z && z.scenes[+digit[1] - 1]; if (sc) goScene(z, sc, e.shiftKey); return; }
  if (e.code === 'Space') { spaceHeld = true; cv.style.cursor = 'grab'; e.preventDefault(); return; }
  if ((ui.tool === 'path' || ui.tool === 'pen') && pathDraft) {
    if (e.key === 'Enter') { finishPath(); return; }
    if (e.key === 'Backspace') { pathDraft.pts.splice(-2); pathDraft.ctl.splice(-4); e.preventDefault(); return; }
    if (e.key === 'Escape') { pathDraft = null; setTool('select'); return; }
  }
  if (k === 'r' && ui.sel.size) { rotateSel(e.shiftKey ? -90 : 90); return; }
  const tools = { v: 'select', l: 'line', m: 'matrix', c: 'circle', p: 'path', n: 'pen', z: 'zone' };
  if (tools[k]) { setTool(tools[k]); return; }
  if (e.key === 'Escape') { if (ui.tool !== 'select') setTool('select'); else if (ui.sel.size) { ui.sel.clear(); onSelection(); } return; }
  if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); if (ui.tool === 'zone') deleteZone(selZone()); else deleteSel(); return; }
  if (k === 'f') { fitView(); return; }
  if (k === 'h') { showRight(ui.rightHidden); return; }
  if (k === 'g') { ui.snap = !ui.snap; $('#vSnap').checked = ui.snap; savePrefs(); toast('Snap ' + (ui.snap ? 'on' : 'off')); return; }
  if (k === 'b') { toggleBlackout(); return; }
  if (k === 'i') { toggleIdentify(); return; }
  if (e.altKey && (e.key === 'ArrowUp' || e.key === 'ArrowDown') && ui.sel.size) { e.preventDefault(); if (!moveOnOutput([...ui.sel], e.key === 'ArrowUp' ? -1 : 1)) toast('Not moved: patch it first, or it is already first or last on its output.'); return; }
  if (ui.outputMode === 'pixel' && ui.pickPx && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
    const f = fxById(ui.pickPx.fid);
    if (f) { e.preventDefault(); pickPixel(f, clamp(ui.pickPx.i + (e.key === 'ArrowRight' ? 1 : -1) * (e.shiftKey ? 10 : 1), 0, f._n - 1)); return; }
  }
  const step = e.shiftKey ? 10 : 1;
  const arrows = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] };
  if (arrows[e.key] && ui.sel.size) { e.preventDefault(); nudge(...arrows[e.key]); }
}

/* ============================================================ boot */
// The stage is drawn when something may have changed: after each new frame of content, and on any input.
// When drawing it after every frame would leave too little time to render the output (very large projects
// or a slow GPU), it is drawn after every few frames instead, so the Art-Net frame rate holds.
let stageDirty = true, drawnFrame = -1, drawCost = 0;
function frameLoop(now) {
  requestAnimationFrame(frameLoop);
  if (!project) return;
  try {
    if (geomDirty) rebuildGeometry();
    const spare = tickPeriod * 0.85 - tickCost;
    const every = spare <= 0 ? 4 : clamp(Math.ceil(drawCost / spare), 1, 4);
    if (stageDirty || frameIndex - drawnFrame >= every) {
      stageDirty = false; drawnFrame = frameIndex;
      const t0 = performance.now();
      drawView();
      drawCost = drawCost * 0.8 + (performance.now() - t0) * 0.2;
    }
  } catch (e) { report('stage', e); }
  try {
    if (ui.dockTab === 'monitor' && !ui.dockCollapsed) drawMonitor(now);
    if (ui.dockTab === 'scenes' && !ui.dockCollapsed) drawSceneProgress();
    if (now - (frameLoop.last || 0) > 200) { frameLoop.last = now; updateStatus(); }
  } catch (e) { report('panels', e); }
}
const redrawStage = () => { stageDirty = true; };

  if (p && p.guide && !p.guide.src) { // the guide image is saved on its own (see saveSoon)
    const g = store.get('openledmapper.guide', null);
    if (g && g.name === p.guide.name && typeof g.src === 'string') { p.guide.src = g.src; guideKept = g.src; }
  }
  try { loadProject(p || demoProject()); }
  catch (e) { // keep a copy of what could not be opened, and start from the demo instead of not starting at all
    report('opening the saved project', e);
    store.set('openledmapper.project.unopened', saved);
    loadProject(demoProject());
    toast('The project kept in this browser could not be opened, so the demo layout is loaded.', 'err');
  }
  setTool('select');
  connectBridge();
  new ResizeObserver(() => { resizeView(); redrawStage(); }).observe(stageEl);
  for (const t of ['pointerdown', 'pointermove', 'pointerup', 'wheel', 'keydown', 'keyup', 'input', 'change', 'click', 'drop']) window.addEventListener(t, redrawStage, { capture: true, passive: true });
  requestAnimationFrame(frameLoop);
  // a handle for the browser console and for tests (olm = openLedMapper)
  window.olm = { get project() { return project; }, get tickCost() { return tickCost; }, get drawCost() { return drawCost; }, get frameIndex() { return frameIndex; }, get clockT() { return clockT; }, glCanvas, samplePick, loadProject, ui, universes: () => universes, computePatch, setOutput, bridge, tick, mixer, goScene, storeScene, loadSource, selectZone, addZone, setTool, mediaEl: id => mediaEls.get(id) };
}
boot();
</script>
